[package]
name        = "plist-nv"
version     = "0.1.0"
description = "Apple property lists in both of their current forms: the XML one over xml-nv, and the binary one with its object table, its offset table and its trailer exposed rather than hidden, so a reader can check the bytes it was handed and a writer produces the bytes Python's plistlib does.  A date is seconds from the 2001 reference instant and data is bytes, each its own type rather than a string somebody has to recognise."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used the
# package yet.
stability   = "experimental"

# `core`: a scan over bytes or text the caller already holds, and every
# public function declares no effect.  A property list date is carried
# as the number the format stores, seconds from the 2001 reference
# instant, so nothing here reads a clock or a zone database.
#
# No `tests/embedded_probe.nv`: the package makes no claim to build for
# a microcontroller.  A property list is a tree of owned strings and
# buffers, and the XML form is read through xml-nv, which makes no such
# claim either.
layer       = "core"

category    = "data"

tags        = ["plist", "property-list", "apple", "macos", "bplist", "xml", "sans-io"]
repository  = "https://github.com/novolang/plist-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.13.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "The two forms of an Apple property list, both ways"

[dependencies]
# xml-nv reads the XML form.  The property list document type is small,
# and a scanner of this package's own would be a second XML parser with
# the same escaping, entity and encoding decisions to get right.
# `plistxml.from_document` takes xml-nv's tree, so a caller that has
# parsed the file already does not parse it twice.  xml-nv is `core`, as
# this package is.
xml-nv = "^0.1.0"
